#brand,#brand *{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}#brand{touch-action:manipulation}
.size-prices{display:grid;grid-template-columns:repeat(3,1fr);gap:0 12px}.size-prices .field{margin:8px 0}.extra-choice{border:1px solid var(--line);border-radius:12px;padding:13px;margin:16px 0}.extra-choice .check{margin:0}.extra-choice p{font-size:11px;margin:8px 0 0}.price-from{display:block;color:var(--muted);font-size:9px;font-weight:400}.price-guide{font-size:11px;color:var(--muted);padding-top:12px}

.campaign-strip{border-bottom:1px solid var(--line);padding:13px 0;display:flex;gap:15px;align-items:center;font-size:12px;color:var(--soft);flex-wrap:wrap}.campaign-strip strong{color:var(--accent);letter-spacing:.08em;text-transform:uppercase;font-size:10px}.campaign-strip span{flex:1;min-width:160px}.legal-links{display:flex;gap:14px;flex-wrap:wrap;padding:0 0 22px;color:var(--muted);font-size:11px}.legal-links button{color:var(--muted);background:none;padding:7px 0;font-size:11px;min-height:35px}.legal-links button:hover{color:var(--text)}

/* Seasonal drawings are decorative only: no interaction and no layout shift. */
.season-visual{position:relative;min-width:0;isolation:isolate}.season-art{position:absolute;inset:0;z-index:3;pointer-events:none;user-select:none;overflow:hidden;border-radius:20px}.season-art svg{position:absolute;display:block;height:auto;stroke-width:1.2}
.season-art .web{width:122px;left:0;top:0;color:var(--accent);opacity:.58}.season-art .ghost{width:53px;right:12px;bottom:34px;color:#f5efe4;filter:drop-shadow(0 3px 8px #0005);animation:ghost-drift 5s ease-in-out infinite}.season-art .ghost.small{width:32px;left:12px;top:60%;opacity:.8;animation-delay:-2s}.season-art .moon{width:30px;right:27px;top:15px;color:var(--accent);opacity:.85}
.season-art .baubles{width:96px;right:13px;top:0;color:var(--accent)}.season-art .pine{width:105px;left:0;top:0;color:#72ab82}.season-art .snowflake{width:17px;color:var(--accent);opacity:.7}.season-art .snowflake.one{left:12px;bottom:45px}.season-art .snowflake.two{right:15px;top:55%}.season-art .snowflake.three{left:40%;top:8px;width:12px}.season-art .snowflake.four{right:29%;bottom:5px;width:12px}
.season-art .burst{width:83px;right:0;top:4px;color:var(--accent);opacity:.8;animation:season-glow 6s ease-in-out infinite}.season-art .spark{width:25px;left:4px;bottom:42px;color:var(--accent);animation:season-glow 6s ease-in-out infinite;animation-delay:-3s}.season-art .spark.tiny{width:12px;left:28%;top:8px}.season-art .ribbon{width:39px;right:11px;bottom:40px;color:var(--accent);opacity:.6}
.season-art .bf-tag{width:74px;right:4px;top:6px;color:var(--accent);transform:rotate(12deg);filter:drop-shadow(0 4px 9px #0005)}.season-art .barcode{width:83px;left:8px;bottom:29px;color:var(--accent);opacity:.6}
@keyframes ghost-drift{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-7px) rotate(4deg)}}@keyframes season-glow{0%,100%{opacity:.5}50%{opacity:.95}}
@media(max-width:700px){.season-art .web{width:90px}.season-art .ghost{width:43px;right:5px;bottom:23px}.season-art .ghost.small{width:25px;left:4px}.season-art .baubles{width:72px;right:4px}.season-art .pine{width:80px}.season-art .burst{width:65px}.season-art .bf-tag{width:60px}.season-art .barcode{width:65px;left:3px;bottom:15px}}

return `<div class="season-art" aria-hidden="true">${art}</div>`}
function heroVisual(hero1,hero2){return `<div class="season-visual">${baseHeroVisual(hero1,hero2)}${seasonDecorations()}</div>`}

function filtered(){let p=state.products.filter(p=>(category==='all'||p.category===category)&&(p.name+' '+p.description).toLocaleLowerCase('es').includes(query.toLocaleLowerCase('es')));if(sort==='low')p.sort((a,b)=>startingPrice(a)-startingPrice(b));if(sort==='high')p.sort((a,b)=>startingPrice(b)-startingPrice(a));if(sort==='featured')p.sort((a,b)=>Number(b.featured)-Number(a.featured));return p}
function catalog(){return `<div class="page-title"><p class="eyebrow">${s('name')} / CATÁLOGO</p><h1>${t('catalogTitle')}</h1><p>${t('catalogDescription')}</p></div><div class="catalogbar"><div class="chips">${['all','shirt','cup','plate'].map(c=>`<button class="chip ${category===c?'active':''}" data-category="${c}" aria-pressed="${category===c}">${catName(c)}</button>`).join('')}</div><label class="search">${ico('search')}<span class="visuallyhidden">Buscar productos</span><input id="searchinput" value="${esc(query)}" placeholder="${t('searchPlaceholder')}" type="search"></label></div><div class="labelrow"><p class="subtle" id="resultcount">${filtered().length} diseños</p><label class="field" style="margin:0"><span class="visuallyhidden">Ordenar productos</span><select id="sort"><option value="featured">Destacados</option><option value="low" ${sort==='low'?'selected':''}>Menor precio</option><option value="high" ${sort==='high'?'selected':''}>Mayor precio</option></select></label></div><div class="grid" id="cataloggrid" style="margin:22px 0 40px">${filtered().map(card).join('')||empty(t('noResults'),'Prueba otra palabra o categoría.')}</div>`}
function render(){const previousVideo=$('herovideo');if(previousVideo)previousVideo.pause();navigation();let html=view==='inicio'?home():view==='catalogo'?catalog():view==='favoritos'?`<div class="page-title"><p class="eyebrow">TU SELECCIÓN</p><h1>${t('favoritesTitle')}</h1><p>${t('favoritesDescription')}</p></div><div class="grid" style="margin:30px 0 40px">${state.products.filter(p=>favorites.includes(p.id)).map(card).join('')||empty('Aún no tienes favoritos.','Toca el corazón de un diseño para guardarlo.','heart')}</div>`:view==='pedido'?order():view==='cuenta'?account():adminPanel();$('app').innerHTML=html+(view==='admin'?'':footer());document.title=state.settings.name+' · Tu idea, hecha tuya'}
function go(v){view=v;render();window.scrollTo({top:0,behavior:'instant'})}
function showModal(html){$('modal').innerHTML=html;if(!$('modal').open)$('modal').showModal()}
function head(title){return `<div class="modal-head"><h2>${title}</h2><button class="close" data-action="close" aria-label="Cerrar">${ico('close')}</button></div>`}
function productModal(id){const p=state.products.find(p=>p.id===id);if(!p)return;detail=p.id;showModal(head('Hazlo tuyo')+`<form id="configure"><div class="modal-body productdetail">${image(p)}<div><p class="eyebrow">${catName(p.category)}</p><h2>${esc(p.name)}</h2><p>${esc(p.description)}</p><p class="subtle" style="margin-top:12px">${ico('clock')} Producción: ${esc(p.time)}</p>${p.category==='shirt'?`<label class="field"><span>Talla</span><select name="size">${SIZES.map(size=>`<option value="${size}" ${size==='L'?'selected':''}>${size} · ${money(unitPrice(p,{size}))}</option>`).join('')}</select></label>`:''}<div class="extra-choice"><label class="check"><input type="checkbox" name="extra">Diseño extra ${p.extraPrice>0?'· desde +'+money(p.extraPrice):'· consultar precio'}</label><p>Importe inicial por unidad. El tamaño y la complejidad se coordinan por WhatsApp antes de confirmar el precio final.</p></div><label class="field"><span>Texto o nombre personalizado · opcional</span><input name="personal" maxlength="30" placeholder="Ej. Carlos" autocomplete="off"></label><p class="subtle">Coordinaremos contigo el diseño final y las opciones disponibles antes de producirlo.</p>${p.sold?'<div class="notice">Este diseño está agotado. Consulta cuándo estará disponible.</div>':''}</div></div><div class="modalfoot"><div><p class="subtle">Total estimado</p><p class="price" id="detailtotal">${money(unitPrice(p,{size:p.category==='shirt'?'L':''}))}</p></div><div class="qty"><button type="button" data-detailqty="-1" aria-label="Disminuir cantidad">−</button><input type="number" id="detailqty" name="qty" value="1" min="1" max="99" step="1" aria-label="Cantidad" required><button type="button" data-detailqty="1" aria-label="Aumentar cantidad">+</button></div><button class="btn" ${p.sold?'disabled':''}>${ico('bag')}Añadir al pedido</button></div></form>`)}
function order(){const lines=cart.map((c,index)=>{const p=state.products.find(p=>p.id===c.id);if(!p)return '';return `<div class="orderline">${image(p)}<div class="info"><h3>${esc(p.name)}</h3><p>${c.size?'Talla '+esc(c.size)+' · ':''}${c.personal?'Texto: '+esc(c.personal):'Sin texto adicional'}</p>${c.extra?`<p>Diseño extra · ${p.extraPrice>0?'desde +'+money(p.extraPrice)+' por unidad':'cotizar por WhatsApp'}</p>`:''}${p.sold?'<p class="danger">Agotado · retíralo para continuar</p>':''}<div class="qty"><button data-cartqty="${index}" data-delta="-1" aria-label="Disminuir cantidad">−</button><input value="${c.qty}" type="number" min="1" max="99" step="1" data-qtyindex="${index}" aria-label="Cantidad de ${esc(p.name)}"><button data-cartqty="${index}" data-delta="1" aria-label="Aumentar cantidad">+</button></div></div><div><strong>${money(unitPrice(p,c)*c.qty)}</strong><button class="textbtn danger" data-remove="${index}">Quitar</button></div></div>`}).join('');const total=cartTotal();return `<div class="page-title"><p class="eyebrow">TU SELECCIÓN / ${cart.length} PRODUCTOS</p><h1>${t('orderTitle')}</h1><p>${t('orderDescription')}</p></div>${!cart.length?empty('Tu pedido empieza con una idea.','Explora el catálogo y personaliza un diseño.','bag'):`<div class="ordergrid"><div>${lines}</div><div class="panel"><h3>Resumen</h3><p>Producción bajo pedido. Confirmamos los detalles contigo por WhatsApp.</p><div class="total"><span>Total estimado</span><span>${money(total)}</span></div><p class="subtle">El envío se cotiza aparte. Si eliges diseño extra, este importe es inicial; confirmaremos el tamaño, la complejidad y el precio final por WhatsApp. Este paso no realiza ningún cobro.</p><button class="btn full" data-action="sendorder" ${cart.some(c=>state.products.find(p=>p.id===c.id)?.sold)?'disabled':''}>${ico('chat')}${t('orderButton')}</button><button class="textbtn" data-view="catalogo">Seguir explorando ${ico('arrow')}</button></div></div>`}`}
function account(){return `<div class="page-title"><p class="eyebrow">A TU GUSTO</p><h1>${t('accountTitle')}</h1><p>${t('accountDescription')}</p></div><div class="accountgrid"><section class="panel"><h3>Tu apariencia</h3><p>Elige el tema que te resulte más cómodo. Se recuerda en este dispositivo.</p><div class="chips">${[['light','Claro'],['dark','Oscuro'],['amoled','AMOLED']].map(([v,l])=>`<button class="chip ${theme===v?'active':''}" data-theme="${v}">${l}</button>`).join('')}</div></section><section class="panel"><h3>¿Te ayudamos a elegir?</h3><p>Cuéntanos qué tienes en mente y coordinamos tu diseño.</p><a class="btn outline" href="${esc(wa(state.texts.customMessage))}" target="_blank" rel="noopener">${ico('chat')}Hablar con LUMIN</a></section></div>`}

function auth(){if(admin){go('admin');return}showModal(head('Acceso de LUMIN')+`<div class="modal-body"><p class="eyebrow">ADMINISTRACIÓN</p><h2 style="margin:12px 0;font-size:28px">Tu tienda, en tus manos.</h2><p class="subtle">En la versión conectada, ingresarás con tu contraseña mediante Supabase Auth.</p><label class="field"><span>Contraseña</span><input type="password" disabled placeholder="Disponible al conectar Supabase" autocomplete="off"></label><button class="btn full" disabled>Ingresar</button><div class="notice">Propuesta de interfaz · sin autenticación real. No ingreses tu contraseña en esta demostración.</div><button class="btn outline full" data-action="demoadmin">Explorar panel de prueba ${ico('arrow')}</button></div>`);$('modal').classList.add('authmodal')}
function connectionBody(){return `<p>La propuesta todavía funciona con datos locales. Para conectar la tienda sin mezclarla con tu POS:</p><div class="notice"><strong>Supabase Auth</strong><br>Una cuenta administradora fija permite mostrar solo la contraseña. Supabase valida email + contraseña; el email se configura previamente. La contraseña nunca se guarda en una tabla propia ni en el HTML.</div><div class="notice"><strong>Contenido compartido</strong><br>products: nombre, categoría, precio, fotos, opciones, agotado, destacado y orden.<br>site_settings: marca, logo, WhatsApp, redes y tiempos.<br>site_content: cada texto identificado por sección y clave.<br>Storage: imágenes de productos y marca.</div><div class="notice"><strong>Permisos en la base de datos</strong><br>El público lee únicamente el contenido publicado. Solo los usuarios con rol administrador pueden agregar o modificar. Las políticas RLS y las de Storage deben aplicarse en Supabase; ocultar el panel o pedir una contraseña en el navegador no protege los datos.</div><div class="notice"><strong>Personalización</strong><br>El tema se guarda en el dispositivo del visitante. Para usuarios con cuenta, puede guardarse en profiles con políticas de acceso por usuario. Realtime puede refrescar productos y textos publicados en otros dispositivos sin perder el carrito.</div><div class="notice"><strong>Antes de integrar</strong><br>Revisar el esquema y las políticas de tu proyecto actual, mapear sus campos y validar en una copia. No borrar ni sustituir tablas existentes. La clave service_role nunca va en el frontend.</div>`}
function adminPanel(){if(!admin)return account();const tabs=[['products','Productos'],['visual','Portada y diseño'],['texts','Textos'],['contact','Marca y contacto'],['backup','Respaldo'],['connection','Supabase']];let body='';if(adminTab==='products')body=`<div class="sectionhead"><div><h2>Tu catálogo</h2><p class="subtle">${state.products.length} productos · ${state.products.filter(p=>p.sold).length} agotados</p></div><button class="btn small" data-action="newproduct">${ico('plus')}Agregar</button></div><div class="notice">Revisa la correspondencia entre fotos y descripciones importadas del sitio: algunos vasos muestran tazas. La placa ya está en su categoría correcta en esta propuesta.</div><div class="adminlist">${state.products.map(p=>`<article class="admincard">${image(p)}<div class="info"><h3>${esc(p.name)}</h3><p>${catName(p.category)} · ${money(p.price)} · ${p.sold?'Agotado':'Disponible'}</p><button data-toggle="${esc(p.id)}">${p.sold?'Marcar disponible':'Marcar agotado'}</button></div><button data-edit="${esc(p.id)}" aria-label="Editar ${esc(p.name)}">${ico('edit')}</button></article>`).join('')}</div>`;if(adminTab==='texts')body=`<form id="textform" class="editor"><h2>Palabras de tu marca</h2><p class="subtle">Edita el contenido de las secciones y las etiquetas principales. Se actualiza en la tienda al guardar.</p>${Object.keys(state.texts).map(k=>`<label class="field"><span>${esc(TEXTLABELS[k]||k)}</span><textarea name="${esc(k)}" maxlength="5000" rows="${state.texts[k].length>100?3:1}" style="min-height:48px">${esc(state.texts[k])}</textarea></label>`).join('')}<div class="savebar"><span>Prueba local · sin publicación</span><button class="btn small">Guardar textos ${ico('check')}</button></div></form>`;if(adminTab==='visual')body=visualEditor();if(adminTab==='contact')body=`<form id="contactform" class="editor"><h2>La identidad de LUMIN</h2><p class="subtle">Estos datos alimentan el encabezado, el pie y todos los enlaces de WhatsApp.</p>${['name','tagline','location','whatsapp','instagram','tiktok','facebook','termsUrl','privacyUrl','claimsUrl'].map(k=>`<label class="field"><span>${esc({name:'Nombre de la tienda',tagline:'Descripción corta',location:'Ciudad / ubicación',whatsapp:'WhatsApp · país + número, sin + ni espacios',instagram:'Instagram · URL completa o vacío',tiktok:'TikTok · URL completa o vacío',facebook:'Facebook · URL completa o vacío',termsUrl:'Términos y condiciones · URL HTTPS del documento final',privacyUrl:'Privacidad · URL HTTPS de la política final',claimsUrl:'Libro de Reclamaciones · URL HTTPS de tu libro operativo'}[k])}</span><input name="${k}" value="${s(k)}" maxlength="500" ${['name','tagline','location','whatsapp'].includes(k)?'required':''} ${k==='whatsapp'?'pattern="[0-9]{10,15}" inputmode="numeric"':['instagram','tiktok','facebook','termsUrl','privacyUrl','claimsUrl'].includes(k)?'type="url"':''}></label>`).join('')}<div class="notice">Los enlaces legales del pie abren las URLs que configures aquí. No sustituyen un Libro de Reclamaciones con registro, constancia y gestión de respuestas. Los documentos finales deben corresponder a tus datos reales y tus condiciones de venta.</div><p class="error" id="contacterror"></p><div class="savebar"><span>Todos los botones usan el mismo WhatsApp.</span><button class="btn small">Guardar cambios ${ico('check')}</button></div></form>`;if(adminTab==='backup')body=`<section class="panel editor"><h2 style="margin-bottom:14px">Tu contenido, contigo.</h2><p>Exporta marca, textos, precios, categorías, disponibilidad y fotografías en un JSON. Puedes importarlo nuevamente en esta propuesta.</p><div class="notice">Este archivo es un respaldo del contenido del prototipo. No incluye cuentas, contraseñas ni pedidos. El respaldo de la base de datos real se configura aparte.</div><div class="two"><button class="btn" data-action="export">Exportar contenido</button><label class="btn outline" style="cursor:pointer">Importar copia<input class="visuallyhidden" id="importfile" type="file" accept=".json,application/json"></label></div><button class="btn outline full" style="margin-top:15px" data-action="exporthtml">Descargar HTML con mis cambios</button><p class="subtle">Importar reemplaza el contenido local tras revisar el archivo y pedir confirmación. Máximo 12 MB.</p></section>`;if(adminTab==='connection')body=`<section class="panel editor"><h2 style="margin-bottom:20px">Conexión a Supabase</h2>${connectionBody()}</section>`;return `<div class="page-title"><p class="eyebrow">ADMINISTRACIÓN / DEMOSTRACIÓN</p><h1>Todo en su lugar.</h1><p>Gestiona tu tienda desde un solo espacio.</p></div><div class="adminnav">${tabs.map(([v,l])=>`<button class="chip ${adminTab===v?'active':''}" data-admintab="${v}">${l}</button>`).join('')}</div>${body}<div style="height:45px"></div>`}
const TEXTLABELS={heroEyebrow:'Portada · etiqueta superior',heroTitle:'Portada · título',heroAccent:'Portada · segunda línea',heroDescription:'Portada · descripción',catalogCTA:'Botón · explorar catálogo',customCTA:'Botón · tengo una idea',production:'Información · producción',guarantee:'Información · garantía',shipping:'Información · envíos',stageCaption:'Portada · pie de fotos',stageStamp:'Portada · sello',selectionEyebrow:'Destacados · etiqueta',selectionTitle:'Destacados · título',viewAll:'Destacados · ver todos',catalogTitle:'Catálogo · título',catalogDescription:'Catálogo · descripción',customEyebrow:'Personalización · etiqueta',customTitle:'Personalización · título',customDescription:'Personalización · descripción',customButton:'Personalización · botón',stepsEyebrow:'Proceso · etiqueta',stepsTitle:'Proceso · título',step1Title:'Paso 1 · título',step1Body:'Paso 1 · descripción',step2Title:'Paso 2 · título',step2Body:'Paso 2 · descripción',step3Title:'Paso 3 · título',step3Body:'Paso 3 · descripción',aboutEyebrow:'Marca · etiqueta',aboutTitle:'Marca · título',aboutBody:'Marca · historia',aboutLink:'Marca · contacto',faqTitle:'Preguntas · título',faq1Question:'Pregunta 1',faq1Answer:'Respuesta 1',faq2Question:'Pregunta 2',faq2Answer:'Respuesta 2',faq3Question:'Pregunta 3',faq3Answer:'Respuesta 3',footer:'Pie de página · descripción',navHome:'Menú · inicio',navCatalog:'Menú · catálogo',navFavorites:'Menú · favoritos',navOrder:'Menú · pedido',navAccount:'Menú · mi espacio',categoryAll:'Categoría · todo',categoryShirt:'Categoría · polos',categoryCup:'Categoría · vasos y tazas',categoryPlate:'Categoría · placas',personalize:'Producto · botón personalizar',soldOut:'Producto · agotado',searchPlaceholder:'Búsqueda · ejemplo',noResults:'Búsqueda · sin resultados',orderTitle:'Pedido · título',orderDescription:'Pedido · descripción',favoritesTitle:'Favoritos · título',favoritesDescription:'Favoritos · descripción',accountTitle:'Mi espacio · título',accountDescription:'Mi function editProduct(id){editingId=id||null;const p=state.products.find(p=>p.id===id)||{name:'',description:'',category:'shirt',price:'',oldPrice:0,image:'',sold:false,featured:false,badge:'Personalizable',time:'24–48 h'};showModal(head(id?'Editar producto':'Nuevo producto')+`<form id="productform"><div class="modal-body"><label class="field"><span>Nombre</span><input name="name" value="${esc(p.name)}" maxlength="180" required></label><div class="two"><label class="field"><span>Categoría</span><select name="category">${['shirt','cup','plate'].map(c=>`<option value="${c}" ${p.category===c?'selected':''}>${catName(c)}</option>`).join('')}</select></label><label class="field"><span>Tiempo de producción</span><input name="time" value="${esc(p.time)}" maxlength="80" required></label></div><div class="two"><label class="field"><span>Precio base · soles</span><input name="price" value="${p.price}" type="number" min="0.01" max="100000" step="0.01" required></label><label class="field"><span>Precio anterior · 0 para ocultarlo</span><input name="oldPrice" value="${p.oldPrice}" type="number" min="0" max="100000" step="0.01" required></label></div><section><h3 style="font-size:17px;margin-top:18px">Precios por talla · solo polos</h3><p class="price-guide">Deja una talla vacía para usar el precio base. Si el producto es vaso o placa, estos campos no se aplican.</p><div class="size-prices">${SIZES.map(size=>`<label class="field"><span>Talla ${size} · S/</span><input name="size_${size}" type="number" min="0.01" max="100000" step="0.01" value="${p.sizePrices?.[size]??''}" placeholder="Precio base"></label>`).join('')}</div><label class="field"><span>Diseño extra · importe inicial por unidad · S/</span><input name="extraPrice" type="number" min="0" max="100000" step="0.01" value="${p.extraPrice||0}" required></label><p class="price-guide">0 = cotizar por WhatsApp sin añadir un importe todavía. El cliente verá que el costo final depende del tamaño y la complejidad.</p></section><label class="field"><span>Descripción · material, tamaño y diseño</span><textarea name="description" maxlength="4000" required>${esc(p.description)}</textarea></label><label class="field"><span>Etiqueta de la tarjeta</span><input name="badge" maxlength="80" value="${esc(p.badge)}"></label><label class="field"><span>Foto · URL HTTPS (o sube una imagen abajo)</span><input name="image" id="imageurl" placeholder="https://…" value="${p.image.startsWith('data:')?'':esc(p.image)}"></label><input id="existingimage" type="hidden" value="${esc(p.image)}"><label class="field"><span>Subir fotografía · JPG, PNG o WebP · hasta 1 MB</span><input id="productphoto" type="file" accept="image/jpeg,image/png,image/webp"></label><p id="photonote" class="subtle">${p.image?'Foto actual conservada si no eliges otra.':'Sin fotografía todavía.'}</p><label class="check"><input name="sold" type="checkbox" ${p.sold?'checked':''}> Producto agotado</label><label class="check"><input name="featured" type="checkbox" ${p.featured?'checked':''}> Mostrar en destacados de inicio</label><p class="error" id="producterror"></p></div><div class="modalfoot"><span class="subtle">Cambios locales de prueba</span><button class="btn">Guardar producto ${ico('check')}</button></div></form>`)}

function visualEditor(){const m=state.settings;return `<section class="editor"><h2>Una portada con vida.</h2><p class="subtle">Una sola pieza visual: foto o video. El catálogo conserva su lugar justo después de la portada.</p><div class="panel" style="margin-top:20px"><h3>Color de la marca</h3>${[['green','Verde salvia','Mantiene la identidad de LUMIN. Recomendado.','#d2e8a3'],['sand','Arena cálida','Más suave, artesanal y cercana.','#e4cfaf'],['lilac','Lavanda suave','Un toque creativo sin colores intensos.','#d5c7ed']].map(([v,n,desc,c])=>`<button class="palette-option ${m.palette===v?'selected':''}" data-palette="${v}"><span class="swatch" style="background:${c}"></span><span>${n}<small>${desc}</small></span>${m.palette===v?ico('check'):''}</button>`).join('')}<label class="field"><span>Espaciado del inicio</span><select id="layoutchoice"><option value="airy" ${m.layout==='airy'?'selected':''}>Con aire · más espacio para las fotos</option><option value="compact" ${m.layout==='compact'?'selected':''}>Compacto · productos más cerca</option></select></label><button class="textbtn" data-view="inicio">Ver cómo queda ${ico('arrow')}</button></div><form id="campaignform" class="panel" style="margin-top:20px"><h3>Campaña de temporada</h3><p class="subtle">Añade decoraciones discretas: fantasmas y telarañas, adornos navideños, destellos de Año Nuevo o etiquetas Black Friday. Conserva el menú y los precios; no aplica descuentos automáticamente.</p><label class="field"><span>Temporada activa</span><select name="season">${Object.entries(SEASONS).map(([key,label])=>`<option value="${key}" ${m.season===key?'selected':''}>${label}</option>`).join('')}</select></label><label class="field"><span>Mensaje de campaña · opcional</span><input name="seasonMessage" value="${esc(m.seasonMessage)}" maxlength="180" placeholder="Ej. Regalos con tu propio diseño"></label><p class="subtle">Sin mensaje, se usa una frase de temporada. Al volver a «Sin campaña», se recupera tu paleta habitual.</p><button class="btn small">Aplicar campaña ${ico('check')}</button></form><form id="mediaform" class="panel" style="margin-top:20px"><h3>Foto o video de inicio</h3><label class="field"><span>Presentación</span><select id="mediatype" name="mediaType"><option value="collage" ${m.mediaType==='collage'?'selected':''}>Dos fotos de productos · original</option><option value="image" ${m.mediaType==='image'?'selected':''}>Una fotografía</option><option value="video" ${m.mediaType==='video'?'selected':''}>Un video</option></select></label><label class="field"><span>Enlace directo HTTPS a la foto o al video</span><input name="mediaSrc" id="mediaurl" value="${m.mediaSrc.startsWith('data:')?'':esc(m.mediaSrc)}" placeholder="https://…/video.mp4"></label><input type="hidden" id="storedmedia" value="${esc(m.mediaSrc)}"><label class="field"><span>O elegir un archivo de tu dispositivo</span><input id="herofile" type="file" accept="image/jpeg,image/png,image/webp,video/mp4,video/webm"></label><p class="filehint" id="medianote">${m.mediaSrc?'Hay un archivo o enlace configurado.':'Sin archivo nuevo.'} Fotos hasta 1 MB; videos MP4/WebM hasta 2 MB para esta demostración. No uses enlaces de YouTube o TikTok: se necesita el archivo directo.</p><label class="field"><span>Foto de portada del video · opcional · URL HTTPS</span><input name="mediaPoster" value="${esc(m.mediaPoster)}" placeholder="https://…/portada.jpg" type="url"></label><label class="field"><span>Ajuste visual</span><select name="mediaFit"><option value="cover" ${m.mediaFit==='cover'?'selected':''}>Llenar espacio · recorta bordes</option><option value="contain" ${m.mediaFit==='contain'?'selected':''}>Mostrar completo · conserva bordes</option></select></label><label class="check"><input name="mediaAutoplay" type="checkbox" ${m.mediaAutoplay?'checked':''}> Reproducir video sin sonido al abrir</label><p class="subtle">El visitante puede pausarlo. Si su dispositivo limita la reproducción automática, podrá iniciarlo con el botón. Se respeta la preferencia de movimiento reducido.</p><p class="error" id="mediaerror"></p><div class="savebar"><span>Una portada, sin carruseles automáticos.</span><button class="btn small">Guardar portada ${ico('check')}</button></div></form></section>`}
function downloadHTML(){const copy=document.documentElement.cloneNode(true);copy.querySelector('#embedded-design').textContent=JSON.stringify(state).replace(/</g,'\\u003c');for(const id of ['app','bottomnav','adminbar','toast','modal'])copy.querySelector('#'+id).innerHTML='';copy.querySelector('#modal').removeAttribute('open');copy.querySelector('body').className='';const url=URL.createObjectURL(new Blob(['<!doctype html>\n'+copy.outerHTML],{type:'text/html;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='LUMIN-personalizado.html';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}

function download(data,name){const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
document.addEventListener('click',e=>{const el=e.target.closest('button,a');if(!el)return;const d=el.dataset;if(d.legal){const url=state.settings[d.legal];if(/^https:\/\//.test(url)){window.open(url,'_blank','noopener')}else{$('modal').classList.remove('authmodal');showModal(head({termsUrl:'Términos y condiciones',privacyUrl:'Privacidad',claimsUrl:'Libro de Reclamaciones'}[d.legal])+`<div class="modal-body"><div class="notice">Vista de propuesta · pendiente de configurar.</div><p>Este apartado necesita el documento o servicio definitivo de LUMIN. Esta demostración no registra reclamos ni publica condiciones legales finales.</p></div>`)}return}if(d.palette&&admin){const old=state.settings.palette;state.settings.palette=d.palette;if(!persist())state.settings.palette=old;render();return}if(d.view){go(d.view);return}if(d.product){$('modal').classList.remove('authmodal');productModal(d.product);return}if(d.fav){favorites=favorites.includes(d.fav)?favorites.filter(x=>x!==d.fav):[...favorites,d.fav];try{localStorage.setItem('lumin-favorites',JSON.stringify(favorites))}catch{}const y=scrollY;render();window.scrollTo(0,y);return}if(d.category){category=d.category;render();return}if(d.theme){setTheme(d.theme);render();return}if(d.admintab&&admin){adminTab=d.admintab;render();return}if(d.edit&&admin){$('modal').classList.remove('authmodal');editProduct(d.edit);return}if(d.toggle&&admin){const old=structuredClone(state);const p=state.products.find(p=>p.id===d.toggle);p.sold=!p.sold;if(!persist())state=old;else notify('Disponibilidad actualizada en la propuesta.');render();return}if(d.detailqty){let v=Number($('detailqty').value)||1;v=Math.max(1,Math.min(99,v+Number(d.detailqty)));$('detailqty').value=v;updateDetailTotal();return}if(d.cartqty){const c=cart[Number(d.cartqty)];c.qty=Math.max(1,Math.min(99,c.qty+Number(d.delta)));render();return}if(d.remove){cart.splice(Number(d.remove),1);render();return}const a=d.action;if(a==='storageinfo'){$('modal').classList.remove('authmodal');showModal(head('Almacenamiento del navegador')+`<div class="modal-body"><p>Este HTML guarda el tema, los favoritos y los cambios de contenido mediante almacenamiento local del navegador. El pedido permanece en memoria mientras la página está abierta.</p><p class="subtle" style="margin-top:15px">No se han integrado herramientas de publicidad o analítica en esta propuesta. Al abrir WhatsApp u otro enlace externo, se aplican también las políticas de ese servicio. Si se agregan herramientas de seguimiento en la tienda definitiva, habrá que revisar sus cookies y el consentimiento correspondiente.</p></div>`)}if(a==='togglemedia'){const v=$('herovideo');if(v){if(v.paused){v.play().then(()=>{el.textContent='Pausar video'}).catch(()=>notify('No se pudo reproducir este video. Revisa el archivo.'))}else{v.pause();el.textContent='Reproducir video'}}}if(a==='exporthtml'&&admin)downloadHTML();if(a==='close')$('modal').close();if(a==='auth')auth();if(a==='demoadmin'){admin=true;$('modal').close();go('admin')}if(a==='admin')go('admin');if(a==='logout'){admin=false;go('inicio');notify('Saliste del panel de prueba.')}if(a==='newproduct'&&admin){$('modal').classList.remove('authmodal');editProduct()}if(a==='connection'){$('modal').classList.remove('authmodal');showModal(head('Conexión propuesta')+`<div class="modal-body">${connectionBody()}</div>`)}if(a==='export'&&admin)download(state,'LUMIN-contenido-'+new Date().toISOString().slice(0,10)+'.json');if(a==='sendorder'){if(cart.some(c=>state.products.find(p=>p.id===c.id)?.sold))return;const text='Hola LUMIN, quisiera confirmar este pedido:\n\n'+cart.map(c=>{const p=state.products.find(p=>p.id===c.id);return `${c.qty} × ${p.name}${c.size?' · Talla '+c.size:''}${c.personal?' · Texto: '+c.personal:''}${c.extra?' · Diseño extra ('+(p.extraPrice>0?'importe inicial desde +'+money(p.extraPrice)+' por unidad':'por cotizar')+')':''} — ${money(unitPrice(p,c)*c.qty)}`}).join('\n')+'\n\nTotal estimado de productos: '+money(cartTotal())+'\n¿Podemos confirmar disponibilidad, tamaño del diseño extra, precio final y costo de envío?';window.open(wa(text),'_blank','noopener')}});
let holdTimer=null,holdTriggered=false,holdStart=null,tapCount=0,lastTap=0;
$('brand').onclick=e=>{if(holdTriggered){e.preventDefault();holdTriggered=false;tapCount=0;return}const now=Date.now();tapCount=now-lastTap<900?tapCount+1:1;lastTap=now;if(tapCount>=5){tapCount=0;auth();return}go('inicio')};
$('brand').addEventListener('pointerdown',e=>{if(e.button!==0)return;holdStart={x:e.clientX,y:e.clientY};holdTriggered=false;clearTimeout(holdTimer);holdTimer=setTimeout(()=>{holdTriggered=true;auth()},2200)});
for(const event of ['pointerup','pointercancel','pointerleave'])$('brand').addEventListener(event,()=>{clearTimeout(holdTimer);holdTimer=null});
$('brand').addEventListener('pointermove',e=>{if(holdStart&&Math.hypot(e.clientX-holdStart.x,e.clientY-holdStart.y)>12)clearTimeout(holdTimer)});
$('brand').addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('keydown',e=>{if(e.ctrlKey&&e.shiftKey&&e.code==='KeyL'){e.preventDefault();auth()}});
$('themequick').onclick=()=>{setTheme(theme==='dark'?'light':theme==='light'?'amoled':'dark');render()};
document.addEventListener('input',e=>{if(e.target.id==='searchinput'){query=e.target.value;$('cataloggrid').innerHTML=filtered().map(card).join('')||empty(t('noResults'),'Prueba otra palabra o categoría.');$('resultcount').textContent=filtered().length+' diseños'}if(e.target.id==='detailqty')updateDetailTotal()});
document.addEventListener('change',async e=>{if(e.target.closest('#configure'))updateDetailTotal();if(e.target.id==='layoutchoice'&&admin){const old=state.settings.layout;state.settings.layout=e.target.value;if(!persist())state.settings.layout=old;render()}
if(e.target.id==='herofile'&&admin){const f=e.target.files[0];if(!f)return;const imageTypes=['image/jpeg','image/png','image/webp'],videoTypes=['video/mp4','video/webm'];const isVideo=videoTypes.includes(f.type);if(!imageTypes.includes(f.type)&&!isVideo){$('mediaerror').textContent='Usa JPG, PNG, WebP, MP4 o WebM.';e.target.value='';return}if(f.size>(isVideo?2:1)*1024*1024){$('mediaerror').textContent=isVideo?'Usa un video de hasta 2 MB.':'Usa una foto de hasta 1 MB.';e.target.value='';return}const reader=new FileReader();reader.onload=()=>{if(!$('storedmedia'))return;$('storedmedia').value=reader.result;$('mediatype').value=isVideo?'video':'image';$('mediaurl').value='';$('medianote').textContent=f.name+' · listo para guardar.';$('mediaerror').textContent=''};reader.readAsDataURL(f)}
if(e.target.id==='sort'){sort=e.target.value;render()}if(e.target.dataset.qtyindex!==undefined){const n=Number(e.target.value);cart[Number(e.target.dataset.qtyindex)].qty=Math.max(1,Math.min(99,Math.floor(n)||1));render()}if(e.target.id==='productphoto'&&admin){const f=e.target.files[0];if(!f)return;if(!['image/jpeg','image/png','image/webp'].includes(f.type)||f.size>1024*1024){$('producterror').textContent='Usa JPG, PNG o WebP de hasta 1 MB.';e.target.value='';return}const r=new FileReader();r.onload=()=>{$('existingimage').value=r.result;$('imageurl').value='';$('photonote').textContent='Nueva foto lista para guardar.';$('producterror').textContent=''};r.readAsDataURL(f)}if(e.target.id==='importfile'&&admin){const f=e.target.files[0];if(!f)return;if(f.size>12*1024*1024){notify('La copia supera 12 MB.');return}try{const o=JSON.parse(await f.text());if(o.settings)o.settings={...DEFAULT.settings,...o.settings};if(!validState(o))throw Error();if(!confirm('¿Reemplazar el contenido de esta propuesta con la copia? Exporta primero si quieres conservar tus cambios.'))return;const old=state;state=o;if(!persist()){state=old;return}cart=[];render();notify('Copia importada.')}catch{notify('Archivo no válido. Usa un respaldo JSON de esta propuesta.')}}});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target,fd=new FormData(f);if(f.id==='configure'){const p=state.products.find(p=>p.id===detail);if(p.sold)return;const qty=Number(fd.get('qty'));if(!Number.isInteger(qty)||qty<1||qty>99)return;const personal=String(fd.get('personal')||'').trim(),size=String(fd.get('size')||''),extra=fd.has('extra');if(p.category==='shirt'&&!SIZES.includes(size))return;const c=cart.find(c=>c.id===p.id&&c.personal===personal&&c.size===size&&c.extra===extra);if(c)c.qty=Math.min(99,c.qty+qty);else cart.push({id:p.id,qty,personal,size,extra});$('modal').close();render();notify('Añadido a tu pedido.')}if(!admin)return;if(f.id==='campaignform'){const key=String(fd.get('season'));if(!Object.hasOwn(SEASONS,key))return;const old=structuredClone(state);state.settings.season=key;state.settings.seasonMessage=String(fd.get('seasonMessage')||'').trim().slice(0,180);if(!persist()){state=old;return}notify('Campaña actualizada.');render()}if(f.id==='mediaform'){const old=structuredClone(state);const type=String(fd.get('mediaType')),url=String(fd.get('mediaSrc')||'').trim(),src=url||$('storedmedia').value,poster=String(fd.get('mediaPoster')||'').trim();if(type!=='collage'&&(!src||!safeMedia(src,type))){$('mediaerror').textContent='Elige un archivo del tipo indicado o un enlace directo HTTPS.';return}if(poster&&!/^https:\/\//.test(poster)){$('mediaerror').textContent='La foto de portada debe usar HTTPS.';return}state.settings.mediaType=type;state.settings.mediaSrc=type==='collage'?'':src;state.settings.mediaPoster=poster;state.settings.mediaFit=String(fd.get('mediaFit'));state.settings.mediaAutoplay=fd.has('mediaAutoplay');if(!validState(state)){$('mediaerror').textContent='Revisa el tipo del archivo y el enlace.';state=old;return}if(!persist()){state=old;return}notify('Portada guardada.');render()}
if(f.id==='textform'){const old=structuredClone(state);for(const key of Object.keys(state.texts))state.texts[key]=String(fd.get(key)||'');if(!persist())state=old;else notify('Textos guardados en la propuesta.');render()}if(f.id==='contactform'){const old=structuredClone(state);for(const k of ['name','tagline','location','whatsapp','instagram','tiktok','facebook','termsUrl','privacyUrl','claimsUrl']){const val=String(fd.get(k)||'').trim();if(['instagram','tiktok','facebook','termsUrl','privacyUrl','claimsUrl'].includes(k)&&val&&!/^https:\/\//.test(val)){$('contacterror').textContent='Los enlaces deben empezar por https://';return}}for(const k of ['name','tagline','location','whatsapp','instagram','tiktok','facebook','termsUrl','privacyUrl','claimsUrl'])state.settings[k]=String(fd.get(k)||'').trim();if(!persist())state=old;else notify('Marca y contacto actualizados.');render()}if(f.id==='productform'){const url=String(fd.get('image')||'').trim(),im=url||$('existingimage').value;if(im&&!safeImage(im)){$('producterror').textContent='Usa una URL HTTPS o una fotografía válida.';return}const p={id:editingId||'p'+Date.now(),name:String(fd.get('name')).trim(),category:String(fd.get('category')),price:Number(fd.get('price')),oldPrice:Number(fd.get('oldPrice')),description:String(fd.get('description')).trim(),image:im,sold:fd.has('sold'),featured:fd.has('featured'),badge:String(fd.get('badge')).trim(),time:String(fd.get('time')).trim(),extraPrice:Number(fd.get('extraPrice')),sizePrices:Object.fromEntries(SIZES.filter(size=>String(fd.get('size_'+size)||'').trim()!=='').map(size=>[size,Number(fd.get('size_'+size))]))};if(p.category!=='shirt')p.sizePrices={};const next=structuredClone(state);const index=next.products.findIndex(x=>x.id===p.id);if(index>=0)next.products[index]=p;else next.products.push(p);if(!validState(next)){$('producterror').textContent='Revisa el nombre, categoría, precios y datos del producto.';return}const old=state;state=next;if(!persist()){state=old;return}$('modal').close();render();notify('Producto guardado en la propuesta.')}});
$('modal').addEventListener('click',e=>{if(e.target===$('modal')){const r=$('modal').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)$('modal').close()}});
document.addEventListener('visibilitychange',()=>{const v=$('herovideo');if(v&&document.hidden)v.pause()});
